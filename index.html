<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Website</title>
  <meta name="description" content="My awesome website">

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      background: #f5f5f5;
      color: #222;
      line-height: 1.6;
    }

    header {
      background: #111;
      color: white;
      padding: 1rem 2rem;
      text-align: center;
    }

    main {
      max-width: 900px;
      margin: 80px auto;
      padding: 20px;
      text-align: center;
    }

    h1 {
      font-size: 3rem;
      margin-bottom: 1rem;
    }

    p {
      font-size: 1.1rem;
      color: #555;
      margin-bottom: 2rem;
    }

    .button {
      display: inline-block;
      padding: 12px 24px;
      background: #111;
      color: white;
      text-decoration: none;
      border-radius: 6px;
      transition: 0.3s;
    }

    .button:hover {
      background: #333;
    }

    footer {
      text-align: center;
      padding: 2rem;
      color: #777;
    }
  </style>
</head>

<body>

  <header>
    <h2>My Website</h2>
  </header>

  <main>
    <h1>Welcome 👋</h1>
    <p>
      This is my website hosted with GitHub Pages.
    </p>

    <a href="#" class="button">Get Started</a>
  </main>

  <footer>
    <p>&copy; 2026 My Website. All rights reserved.</p>
  </footer>

</body>
</html>
